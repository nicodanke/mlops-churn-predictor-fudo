# Variante de config/model.yaml para correr el pipeline en GCP.
#
# Lo unico que cambia respecto de la config local son las rutas: pandas y pyarrow leen
# y escriben gs:// de forma nativa gracias a gcsfs, asi que el codigo del pipeline es
# exactamente el mismo. El resto del archivo se hereda de config/model.yaml.
#
#   gcloud run jobs deploy churn-pipeline \
#     --set-env-vars=CHURN_CONFIG=/app/deploy/config.gcp.yaml,CHURN_BUCKET=mi-bucket

data:
  raw_path: "gs://CHURN_BUCKET/raw/account_stats_since_2024.csv"
  interim_path: "gs://CHURN_BUCKET/interim/panel.parquet"
  features_path: "gs://CHURN_BUCKET/interim/features.parquet"

labeling:
  confirm_window: 3
  ambiguous_policy: "drop"
  min_months_in_panel: 2

features:
  lags: [1, 2, 3]
  rolling_window: 3
  exclude_patterns: []

split:
  n_test_periods: 2
  n_val_periods: 2

model:
  type: "xgboost"
  params:
    objective: "binary:logistic"
    eval_metric: "aucpr"
    n_estimators: 2000
    learning_rate: 0.05
    max_depth: 6
    min_child_weight: 5
    subsample: 0.8
    colsample_bytree: 0.7
    reg_lambda: 2.0
    reg_alpha: 0.5
    gamma: 0.0
    tree_method: "hist"
    n_jobs: -1
    random_state: 42
  early_stopping_rounds: 100
  scale_pos_weight: null
  calibration: "isotonic"

evaluation:
  min_pr_auc: 0.20
  top_k_fractions: [0.01, 0.05, 0.10, 0.20]

risk:
  no_churn_threshold: null
  revenue_at_risk_bands:
    alto: 40.0
    medio: 15.0
    bajo: 0.0

explain:
  top_n_features: 8
  max_rows: null

scoring:
  output_dir: "gs://CHURN_BUCKET/predictions"
  formats: ["parquet", "json"]

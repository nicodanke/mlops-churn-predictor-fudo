# Construye y publica las tres imagenes en Artifact Registry con Cloud Build.
#
# Es la alternativa manual: el camino normal es GitHub Actions, que construye con cache
# de capas y despliega solo (.github/workflows/deploy.yml).
#
#   make gcp-build GCP_PROJECT=mi-proyecto
#
# Requiere haber corrido deploy/bootstrap.sh (crea el repositorio `churn`).

substitutions:
  _REGION: us-central1
  _REPO: churn
  _TAG: latest

options:
  logging: CLOUD_LOGGING_ONLY
  # Sin machineType: la maquina por defecto es la que entra en los minutos gratis
  # mensuales de Cloud Build. Una E2_HIGHCPU_8 es mas rapida pero se paga desde el
  # primer minuto.

steps:
  - id: build-pipeline
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - docker/Dockerfile.pipeline
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/pipeline:${_TAG}
      - .

  - id: build-api
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - -f
      - docker/Dockerfile.api
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:${_TAG}
      - .

  - id: build-web
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - -f
      - docker/Dockerfile.web
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:${_TAG}
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/pipeline:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:${_TAG}

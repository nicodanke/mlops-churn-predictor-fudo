[project]
name = "churn-predictor-fudo"
version = "0.1.0"
description = "Predictor de churn de cuentas (restaurantes) del SaaS Fudo: entrenamiento, scoring batch, explicabilidad y API."
authors = [{ name = "Nicolas Dankiewicz" }, { name = "Camila Zaffar" }, { name = "Maria Clara Sanchez" }]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas (>=2.2,<3.0)",
    "numpy (>=1.26,<3.0)",
    "pyarrow (>=16.0,<22.0)",
    "scikit-learn (>=1.5,<2.0)",
    "xgboost (>=2.1,<3.1)",
    "shap (>=0.46,<0.49)",
    "pyyaml (>=6.0,<7.0)",
    "typer (>=0.12,<0.16)",
    "rich (>=13.7,<15.0)",
    "joblib (>=1.4,<2.0)",
    "matplotlib (>=3.9,<4.0)",
]

[project.optional-dependencies]
api = [
    "fastapi (>=0.115,<0.120)",
    "uvicorn[standard] (>=0.30,<0.40)",
    "pydantic (>=2.8,<3.0)",
    "pydantic-settings (>=2.4,<3.0)",
]
gcp = [
    "google-cloud-storage (>=2.18,<4.0)",
    "gcsfs (>=2024.6,<2026.0)",
]
llm = [
    "anthropic (>=0.40,<1.0)",
]

[project.scripts]
churn = "churn.cli:app"

[tool.poetry]
packages = [{ include = "churn", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^5.0"
ruff = "^0.6"
ipykernel = "^6.29"
httpx = "^0.28"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# B008 penaliza llamadas en argumentos por defecto, pero Depends()/Query() en la firma
# es exactamente como FastAPI declara dependencias y validaciones.
"api/app/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "api"]

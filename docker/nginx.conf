server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # En Cloud Run el puerto lo define $PORT, pero nginx lo resuelve por variable
    # de entorno en el entrypoint oficial de la imagen.

    location / {
        try_files $uri $uri/ /index.html;
    }

    # config.js se regenera en cada arranque: nunca debe cachearse.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=300";
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
